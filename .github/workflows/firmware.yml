name: PlatformIO CI

on:
  push:
    paths:
      - 'software/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup env
      run: |
        echo "OC_ARTIFACT_TAG=${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" | tr '/' '_' >> $GITHUB_ENV

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: '**/requirements.txt'

    - run: |
        pip3 install --upgrade pip
        pip3 install -r .github/workflows/requirements.txt

    - name: Build firmware
      working-directory: software/
      run: |
        pio run

    - name: Copy artifact
      uses: actions/upload-artifact@v4
      with:
        name: o_C-${{env.OC_ARTIFACT_TAG}}
        path: |
          software/*.hex
          software/.pio/build/*/*.hex

    - name: Delete existing UGLIALL-latest release and tag
      if: github.ref_name == 'UGLIALL-on-uglimods'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete UGLIALL-latest --repo ${{ github.repository }} --yes || true
        git push origin :refs/tags/UGLIALL-latest || true

    - name: Publish UGLIALL release
      if: github.ref_name == 'UGLIALL-on-uglimods'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: UGLIALL-latest
        name: UGLIALL Latest
        body: |
          Latest firmware build from the UGLIALL branch.

          **Audio applets (T41 only):**
          - FMDrum, Glitch, Mist (granular), AdvKrpsStrng (Karplus-Strong)
          - WavRecorder — SD card WAV recorder; 1 MB PSRAM ring buffer if PSRAM present, 64 KB internal RAM fallback otherwise (T41 only, not T41+audio)

          **CV applets:**
          - MarkoV, MarkovPerc (sequencers)

          Built from ${{ github.sha }}
        prerelease: true
        make_latest: true
        files: software/*.hex
